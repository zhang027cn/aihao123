name: 定时更新数据

on:
  schedule:
    - cron: "17 */4 * * *"   # 每 4 小时
  workflow_dispatch:        # 手动触发

permissions:
  contents: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "22"

      - name: 抓取数据
        run: node scripts/fetch.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成 AI 摘要（商汤 SenseNova）
        run: node scripts/summarize.mjs
        env:
          SENSENOVA_KEY: ${{ secrets.SENSENOVA_KEY }}
        timeout-minutes: 30

      - name: 提交变更
        run: |
          git config user.name "aihao123-bot"
          git config user.email "aihao123-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "无数据变更"
          else
            git commit -m "data: 自动更新 $(date -u +%Y-%m-%d\ %H:%M)"
            git push
          fi
