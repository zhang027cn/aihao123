# AI Hao123 站点配置 —— 适配现有 nginx（与 family.zgc.pub 共存）
# 放到 /etc/nginx/sites-available/aihao123 并软链到 sites-enabled/
# 使用现有 acme.sh 通配符证书 *.zgc.pub（无需重新签发）
# 注意：aihao123.zgc.pub 需在阿里云 DNS 添加 A 记录 -> 120.55.186.51

server {
    listen 80;
    listen [::]:80;
    server_name aihao123.zgc.pub;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name aihao123.zgc.pub;

    # 复用现有通配符证书 *.zgc.pub（SAN 已覆盖本域名）
    ssl_certificate     /etc/nginx/ssl/zgc.pub.crt;
    ssl_certificate_key /etc/nginx/ssl/zgc.pub.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /var/www/aihao123;
    index index.html;

    # 静态资源：带 hash 的 js/css 长期缓存
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # 数据 JSON：每 4 小时更新，短缓存保证及时可见
    location /data/ {
        expires 5m;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # HTML：不缓存
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 安全头
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;
    add_header Referrer-Policy strict-origin-when-cross-origin;
}
